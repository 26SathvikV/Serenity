name: Build Release

# Triggered by a version tag push (e.g. git tag v2.0.1 && git push --tags).
# workflow_dispatch lets you test the build from the Actions tab without a tag
# -- the upload step is skipped when there is no tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # required to create/upload GitHub Releases

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact_glob: "dist/*.exe"

          - os: macos-latest
            platform: mac
            artifact_glob: "dist/*.dmg"

          - os: ubuntu-latest
            platform: linux
            artifact_glob: "dist/*.AppImage"

    runs-on: ${{ matrix.os }}

    steps:
      # ------------------------------------------------------------------ #
      # 1. Source
      # ------------------------------------------------------------------ #
      - uses: actions/checkout@v4

      # ------------------------------------------------------------------ #
      # 2. Node.js
      # ------------------------------------------------------------------ #
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ------------------------------------------------------------------ #
      # 3. Dependencies (postinstall rebuilds native modules for Electron)
      # ------------------------------------------------------------------ #
      - name: Install dependencies
        run: npm ci

      # ------------------------------------------------------------------ #
      # 4. Code signing environment (optional, silently skipped if the
      #    required secrets are not set in repo Settings > Secrets).
      #
      #  Windows, store in secrets:
      #    WIN_CSC_LINK          base64-encoded .pfx certificate
      #    WIN_CSC_KEY_PASSWORD  password for the .pfx
      #    To base64-encode:  certutil -encode cert.pfx cert.b64
      #
      #  macOS, store in secrets:
      #    APPLE_CERT_P12         base64-encoded .p12 Developer ID cert export
      #    APPLE_CERT_PASSWORD    password used when exporting the .p12
      #    APPLE_ID               your Apple ID email
      #    APPLE_APP_PASSWORD     app-specific password (appleid.apple.com)
      #    APPLE_TEAM_ID          10-char team ID from developer.apple.com
      #    To base64-encode:  base64 -i cert.p12 | pbcopy
      # ------------------------------------------------------------------ #

      # ------------------------------------------------------------------ #
      # 5. Build with electron-builder
      # ------------------------------------------------------------------ #
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          WIN_CSC_LINK:         ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if (-not $env:WIN_CSC_LINK) {
            Write-Host "WIN_CSC_LINK not set -- building without code signing"
            $env:WIN_CSC_LINK = ""
          }
          npx electron-builder --win --publish=never

      - name: Build (macOS)
        if: runner.os == 'macOS'
        env:
          CSC_LINK:                    ${{ secrets.APPLE_CERT_P12 }}
          CSC_KEY_PASSWORD:            ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID:                    ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID:               ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "APPLE_CERT_P12 not set -- building without code signing"
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          npx electron-builder --mac --publish=never

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux --publish=never

      # ------------------------------------------------------------------ #
      # 6. Upload artifacts (only on tag pushes, not workflow_dispatch)
      # ------------------------------------------------------------------ #
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_glob }}
